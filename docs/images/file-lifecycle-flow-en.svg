<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img" aria-labelledby="title desc">
  <title id="title">webcool File Lifecycle Flow</title>
  <desc id="desc">Shows how files move from upload/import to virtual disk, tags, preview, delete, recycle bin, restore, and permanent delete.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#46719d"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#6d8dad" flood-opacity="0.16"/>
    </filter>
  </defs>
  <rect width="1100" height="520" rx="28" fill="#f7fbff"/>
  <text x="550" y="58" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#233f5f">Secure File Lifecycle</text>

  <g font-family="Arial, sans-serif" filter="url(#shadow)">
    <rect x="70" y="210" width="180" height="76" rx="16" fill="#ffffff" stroke="#c9dced"/>
    <text x="160" y="242" text-anchor="middle" font-size="18" font-weight="700" fill="#244b70">Upload or Import</text>
    <text x="160" y="268" text-anchor="middle" font-size="14" fill="#67809a">Browser / Local / Mobile</text>

    <rect x="315" y="210" width="170" height="76" rx="16" fill="#e7f4ff" stroke="#a9cdea"/>
    <text x="400" y="257" text-anchor="middle" font-size="21" font-weight="700" fill="#244b70">Virtual Disk</text>

    <rect x="560" y="92" width="170" height="66" rx="15" fill="#fff4df" stroke="#eccb8f"/>
    <text x="645" y="133" text-anchor="middle" font-size="19" font-weight="700" fill="#71501d">Tag</text>

    <rect x="560" y="210" width="170" height="66" rx="15" fill="#eaf8f0" stroke="#aedbc0"/>
    <text x="645" y="251" text-anchor="middle" font-size="19" font-weight="700" fill="#245d3f">Preview</text>

    <rect x="560" y="328" width="170" height="66" rx="15" fill="#eef0ff" stroke="#c9c0f2"/>
    <text x="645" y="355" text-anchor="middle" font-size="18" font-weight="700" fill="#4b4384">Copy / Move</text>
    <text x="645" y="379" text-anchor="middle" font-size="18" font-weight="700" fill="#4b4384">Rename</text>

    <rect x="790" y="210" width="140" height="66" rx="15" fill="#fff0f0" stroke="#e3b2b2"/>
    <text x="860" y="251" text-anchor="middle" font-size="19" font-weight="700" fill="#8a3434">Delete</text>

    <rect x="790" y="328" width="140" height="66" rx="15" fill="#fff7e6" stroke="#e6c58a"/>
    <text x="860" y="369" text-anchor="middle" font-size="19" font-weight="700" fill="#7a5518">Recycle Bin</text>

    <rect x="968" y="278" width="100" height="56" rx="14" fill="#eaf8f0" stroke="#aedbc0"/>
    <text x="1018" y="312" text-anchor="middle" font-size="17" font-weight="700" fill="#245d3f">Restore</text>

    <rect x="956" y="384" width="112" height="56" rx="14" fill="#ffecec" stroke="#e3b2b2"/>
    <text x="1012" y="407" text-anchor="middle" font-size="15" font-weight="700" fill="#8a3434">Permanent</text>
    <text x="1012" y="427" text-anchor="middle" font-size="15" font-weight="700" fill="#8a3434">Delete</text>

    <rect x="760" y="84" width="170" height="38" rx="12" fill="#ffffff" stroke="#e5edf6"/>
    <text x="845" y="109" text-anchor="middle" font-size="15" fill="#597792">Cross-directory</text>
  </g>

  <g stroke="#46719d" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <path d="M250 248 L315 248"/>
    <path d="M485 238 C520 185 535 145 560 128"/>
    <path d="M485 248 L560 248"/>
    <path d="M485 260 C520 315 535 350 560 360"/>
    <path d="M730 243 L790 243"/>
    <path d="M860 276 L860 328"/>
    <path d="M930 355 C952 335 965 320 968 310"/>
    <path d="M930 380 C952 398 962 407 968 412"/>
    <path d="M730 116 C742 106 748 103 760 103"/>
  </g>

  <text x="550" y="480" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#486987">Deletion is not the end: files first enter a recoverable stage before restore or permanent delete.</text>
</svg>
